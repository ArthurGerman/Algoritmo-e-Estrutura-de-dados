<h1>Algoritmos de ordenação</h1>
<p>O Bubble Sort troca elementos adjacentes fora de ordem e custa O(n&sup2;) no pior caso. O Quicksort escolhe um piv&ocirc; e divide o problema, com custo m&eacute;dio O(n log n).</p><p>Depois de ordenar, a <a href="busca.html">busca bin&aacute;ria</a> fica poss&iacute;vel.</p>
