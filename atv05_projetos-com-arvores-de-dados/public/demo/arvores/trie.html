<h1>Trie: árvore de prefixos</h1>
<p>Na Trie, palavras com o mesmo prefixo compartilham o caminho. A busca custa O(m), onde m &eacute; o tamanho da palavra, e listar palavras por prefixo &eacute; natural, o que a torna ideal para autocompletar.</p><p>Veja tamb&eacute;m a <a href="avl.html">&Aacute;rvore AVL</a> e a <a href="../algoritmos/busca.html">busca</a>.</p>
